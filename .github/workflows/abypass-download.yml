name: aBypass direct download

on:
  push:
    branches: ['codex/abypass-android']
    paths: ['.github/workflows/abypass-download.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'oleg-png23/any'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the verified 0.1.3 APK
        shell: bash
        run: |
          set -euo pipefail
          abypass_download_dir="$(mktemp -d)"
          cd "$abypass_download_dir"
          gh api repos/oleg-png23/any/actions/artifacts/12415514259/zip > package.zip
          unzip -q package.zip
          printf '%s  %s\n' '467bd742a70b0b4c1c4992303e21e3710101a72ef45995c7d9ad6a7a5a27f2a2' 'aBypass-0.1.3-arm64.apk' | sha256sum --check -
          cat > RELEASE-NOTES.md <<'NOTES'
          aBypass 0.1.3 — пробная сборка для Android 8.0+, ARM64.

          Яркая палитра Google, цвета обоев Material You, центрированные значки и исправленная компоновка при крупном шрифте.

          Подпись тестовой сборки отличается от предыдущих версий. Перед установкой потребуется удалить прежнюю версию; локальные настройки и вход в аккаунт будут сброшены.

          Работа Flow с конкретным аккаунтом требует проверки на устройстве. Исходный код соответствует коммиту 84857f590ad56daa62e51074107a0d1fe9167b55.
          NOTES
          gh release create abypass-v0.1.3 aBypass-0.1.3-arm64.apk SHA256SUMS --repo oleg-png23/any --target 84857f590ad56daa62e51074107a0d1fe9167b55 --title 'aBypass 0.1.3' --prerelease --notes-file RELEASE-NOTES.md
