name: aBypass Android

on:
  push:
    branches: [main, 'codex/abypass-*']
    paths: ['aBypass/**', '.github/workflows/abypass-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abypass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests and ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aBypass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Adapter regression tests
        run: node --test tests/compat.test.cjs
      - name: Lint, JVM tests and debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace
      - name: Collect APK and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/aBypass-0.1.0-arm64.apk
          cd out
          sha256sum aBypass-0.1.0-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aBypass-0.1.0-arm64
          path: aBypass/out/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abypass-build-reports
          path: |
            aBypass/app/build/reports/
            aBypass/app/build/test-results/

  ui:
    name: Material 3 UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: aBypass
          script: |
            ./gradlew -PabypassAbis=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest --stacktrace || { adb pull /sdcard/Android/data/app.abypass/files/screenshots ui-screenshots; exit 1; }
            adb pull /sdcard/Android/data/app.abypass/files/screenshots ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abypass-ui-checks
          path: |
            aBypass/app/build/reports/androidTests/
            aBypass/app/build/outputs/androidTest-results/
            aBypass/ui-screenshots/
