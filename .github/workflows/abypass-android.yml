name: aBypass Android

on:
  push:
    branches: [main, 'codex/abypass-*']
    paths: ['aBypass/**', '.github/workflows/abypass-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abypass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests and ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aBypass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Adapter regression tests
        run: node --test tests/compat.test.cjs
      - name: Lint, JVM tests and debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace
      - name: Collect APK and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/aBypass-0.1.8-arm64.apk
          abypass_signer="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$abypass_signer" verify --verbose --print-certs out/aBypass-0.1.8-arm64.apk > out/APK-SIGNATURE.txt
          abypass_tools="${abypass_signer%/*}"
          "$abypass_tools/aapt2" dump badging out/aBypass-0.1.8-arm64.apk > out/APK-INFO.txt
          cd out
          sha256sum aBypass-0.1.8-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aBypass-0.1.8-arm64
          path: aBypass/out/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abypass-build-reports
          path: |
            aBypass/app/build/reports/
            aBypass/app/build/test-results/

  ui:
    name: Material 3 UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          working-directory: aBypass
          script: |
            ./gradlew -PabypassAbis=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest --stacktrace || { adb pull /sdcard/Android/data/app.abypass/files/screenshots ui-screenshots; exit 1; }
            adb pull /sdcard/Android/data/app.abypass/files/screenshots ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abypass-ui-checks
          path: |
            aBypass/app/build/reports/androidTests/
            aBypass/app/build/outputs/androidTest-results/
            aBypass/ui-screenshots/


  publish:
    name: Publish direct APK download
    needs: [build, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aBypass-0.1.8-arm64
          path: package
      - name: Verify and publish this version
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          if gh release view abypass-v0.1.8 --repo oleg-png23/any > /dev/null 2>&1; then
            echo 'Version 0.1.8 already published; keeping its immutable release.'
            exit 0
          fi
          cat > RELEASE-NOTES.md <<'NOTES'
          aBypass 0.1.8 — пробная сборка для Android 8.0+, ARM64.

          Полностью переработан нативный интерфейс в направлении Pixel и Material 3 Expressive: компактная сетка сервисов, связанные группы настроек, превью тем, динамические цвета и плавающая панель браузера.

          Добавлены пружинные переходы между разделами, изменение формы плиток при нажатии, анимации фильтров и избранного, волнистый индикатор загрузки. Крупный шрифт использует одну колонку.

          Работа адаптера Flow сохранена. Поддержка доступа к AI Studio в этой версии не менялась.

          Подпись тестовой сборки отличается от предыдущих версий. Перед установкой потребуется удалить прежнюю версию; настройки и вход внутри приложения будут сброшены.
          NOTES
          gh release create abypass-v0.1.8 aBypass-0.1.8-arm64.apk SHA256SUMS --repo oleg-png23/any --target "$GITHUB_SHA" --title 'aBypass 0.1.8' --prerelease --notes-file RELEASE-NOTES.md


